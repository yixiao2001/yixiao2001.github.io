<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Xiao - Academic Homepage</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="config.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1XGFB4QMFE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1XGFB4QMFE');
    </script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!-- Navigation -->
    <nav class="navbar" id="navbar" aria-label="Main navigation">
        <div class="nav-container">
            <a href="#home" class="nav-logo">Yi Xiao</a>
            <div class="nav-menu" id="nav-menu">
                <a href="#about" class="nav-link">About</a>
                <a href="#publications" class="nav-link">Publications</a>
                <a href="#experience" class="nav-link">Experience</a>
                <a href="#services" class="nav-link">Services</a>
                <a href="#awards" class="nav-link">Awards</a>
            </div>
            <button type="button" class="nav-toggle" id="mobile-menu" aria-label="Toggle menu" aria-controls="nav-menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </nav>

    <main class="page" id="main-content">
        <!-- Hero -->
        <section id="home" class="hero">
            <div class="hero-inner">
                <div class="hero-photo-wrap">
                    <img src="profile.jpg" alt="Yi Xiao" class="hero-photo" width="198" height="236" fetchpriority="high">
                </div>
                <div class="hero-content">
                    <p class="hero-eyebrow">Software Engineering Research</p>
                    <h1 class="hero-title">Yi Xiao</h1>
                    <p class="hero-subtitle">PhD Student, Chongqing University</p>
                    <div class="hero-tags" id="hero-tags"></div>
                    <div class="contact-info" id="contact-info"></div>
                </div>
            </div>
        </section>

        <!-- About -->
        <section id="about" class="section">
            <div class="section-head">
                <span class="section-index">01</span>
                <h2 class="section-title">About Me</h2>
            </div>
            <div class="about-text"></div>
        </section>

        <!-- Publications -->
        <section id="publications" class="section">
            <div class="section-head">
                <span class="section-index">02</span>
                <h2 class="section-title">Publications</h2>
            </div>
            <div class="publications-list"></div>
            <p class="pubs-more" id="pubs-more"></p>
        </section>

        <!-- Experience -->
        <section id="experience" class="section">
            <div class="section-head">
                <span class="section-index">03</span>
                <h2 class="section-title">Experience</h2>
            </div>
            <div class="experience-list"></div>
        </section>

        <!-- Services -->
        <section id="services" class="section">
            <div class="section-head">
                <span class="section-index">04</span>
                <h2 class="section-title">Academic Services</h2>
            </div>
            <div class="services-content"></div>
        </section>

        <!-- Awards -->
        <section id="awards" class="section">
            <div class="section-head">
                <span class="section-index">05</span>
                <h2 class="section-title">Awards</h2>
            </div>
            <div class="awards-list"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <p>&copy; 2026 Yi Xiao. All rights reserved.</p>
            <p class="footer-stats">Total visits: <span id="footer-visits">—</span> · <a href="analytics.html" class="footer-link">Analytics</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
