<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Analytics - Yi Xiao</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171717'/%3E%3Cpath d='M10 9l6 7 6-7h4l-8 10v6h-4v-6L6 9z' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <style>
        .analytics-container {
            max-width: 900px;
            margin: 100px auto 2rem;
            padding: 0 2rem;
        }

        .analytics-header h1 {
            color: var(--vercel-black);
            margin-bottom: 1.5rem;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -1.28px;
        }

        .stats-row {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 600;
            color: var(--vercel-black);
            letter-spacing: -0.96px;
        }

        .stat-label {
            color: var(--gray-500);
            font-size: 14px;
        }

        .visitor-list {
            background: var(--pure-white);
            border-radius: var(--radius-comfortable);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .visitor-list-header {
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 16px;
            color: var(--vercel-black);
            border-bottom: 1px solid var(--gray-100);
        }

        .visitor-item {
            padding: 0.625rem 1rem;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .visitor-item:last-child {
            border-bottom: none;
        }

        .visitor-info {
            color: var(--gray-600);
        }

        .visitor-time {
            color: var(--gray-400);
            font-size: 13px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--vercel-black);
            text-decoration: none;
            margin-bottom: 2rem;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 16px;
            background: var(--pure-white);
            border-radius: var(--radius-standard);
            box-shadow: var(--shadow-ring);
            transition: var(--transition);
        }

        .back-link:hover {
            background: var(--gray-50);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="analytics-container">
            <a href="index.html" class="back-link">← Back to Homepage</a>
            <div class="analytics-header">
                <h1>Visitor Analytics</h1>
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-number" id="total-visits">0</span>
                        <span class="stat-label">Total Visits</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="today-visits">0</span>
                        <span class="stat-label">Today</span>
                    </div>
                </div>
            </div>
            <div class="visitor-list">
                <div class="visitor-list-header">Recent Visitors</div>
                <div id="visitor-list-content"></div>
            </div>
        </div>
    </div>
    <script src="analytics.js"></script>
</body>
</html>
